name: front-cd

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/front-cd.yml'
  workflow_dispatch:

concurrency:
  group: deploy-front
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE: arn:aws:iam::416121583617:role/lovebug-github-actions
  BUCKET: lovebug-s3-416121583617-ap-northeast-2-an
  DISTRIBUTION_ID: EO3BGF5150BB9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # frontend/package.json 의 engines.node 와 맞춘다.
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # 빌드 환경 값은 저장소가 아니라 GitHub Actions Variables/Secrets 에서 주입한다.
          # 값이 실제로 비밀이면 vars 대신 secrets 로 옮긴다 — 참조 위치만 바뀌고
          # 나머지는 그대로다. 다만 Vite 는 VITE_ 접두사 값을 빌드 시점에 번들에 박고
          # 번들은 브라우저가 내려받으므로, 여기에 진짜 비밀을 넣지 않는다(마스킹은
          # 로그에만 적용되지 정적 파일에는 적용되지 않는다).
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::error::Variable VITE_API_BASE_URL 이 비어 있다." \
              " 비어 있으면 번들이 로컬 기본값(http://localhost:8080)을 부른다." \
              " Settings > Secrets and variables > Actions > Variables 에 등록할 것" \
              " (운영 값: https://api.ubidic.site)."
            exit 1
          fi
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync hashed assets to S3
        working-directory: frontend
        run: |
          # 파일명에 해시가 붙는 산출물만 장기 캐시한다. index.html 은 다음 스텝에서 따로 올린다.
          # --delete 는 여기서 하지 않는다 — index.html 을 아직 안 올린 상태로 지우면
          # 그 사이 요청이 404 가 된다. 정리는 마지막 스텝에서 한다.
          aws s3 sync dist/ "s3://$BUCKET/lovebug/web/" \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html to S3
        working-directory: frontend
        run: |
          aws s3 cp dist/index.html "s3://$BUCKET/lovebug/web/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Prune removed files
        working-directory: frontend
        run: |
          # 이전 배포에만 있던 파일(구 정적 html 포함)을 지운다.
          aws s3 sync dist/ "s3://$BUCKET/lovebug/web/" --delete --size-only --exclude "index.html"

      - name: Ensure CloudFront SPA fallback
        run: |
          # createBrowserRouter 를 쓰므로 /workspaces 같은 딥링크를 새로고침하면 S3 오리진이
          # 404(공개 버킷) 또는 403(OAC)을 돌려준다. 그 둘을 index.html + 200 으로 바꿔야
          # 라우터가 경로를 처리한다. frontend/nginx.conf 의 try_files 와 같은 역할이다.
          #
          # 이미 같은 설정이면 UpdateDistribution 을 호출하지 않는다 — 매 배포마다 배포본을
          # 갱신하면 전파(InProgress)가 불필요하게 반복된다.
          aws cloudfront get-distribution-config \
            --id "$DISTRIBUTION_ID" \
            --output json > /tmp/dist.json

          ETAG="$(jq -r '.ETag' /tmp/dist.json)"
          jq '.DistributionConfig' /tmp/dist.json > /tmp/config.json

          jq '
            .CustomErrorResponses = {
              Quantity: 2,
              Items: [
                {
                  ErrorCode: 403,
                  ResponsePagePath: "/index.html",
                  ResponseCode: "200",
                  ErrorCachingMinTTL: 0
                },
                {
                  ErrorCode: 404,
                  ResponsePagePath: "/index.html",
                  ResponseCode: "200",
                  ErrorCachingMinTTL: 0
                }
              ]
            }
          ' /tmp/config.json > /tmp/config-desired.json

          if jq -e -s '.[0].CustomErrorResponses == .[1].CustomErrorResponses' \
               /tmp/config.json /tmp/config-desired.json > /dev/null; then
            echo "SPA fallback already configured; skipping update."
          else
            aws cloudfront update-distribution \
              --id "$DISTRIBUTION_ID" \
              --if-match "$ETAG" \
              --distribution-config "file:///tmp/config-desired.json" \
              --output text --query 'Distribution.Status'
          fi

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
