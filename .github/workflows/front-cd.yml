name: front-cd

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/front-cd.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE: arn:aws:iam::416121583617:role/lovebug-github-actions
  BUCKET: lovebug-s3-416121583617-ap-northeast-2-an
  DISTRIBUTION_ID: EO3BGF5150BB9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        working-directory: ui
        run: |
          aws s3 sync dist/ "s3://$BUCKET/lovebug/web/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"
          aws s3 cp dist/index.html "s3://$BUCKET/lovebug/web/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" "/"
