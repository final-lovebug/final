name: oidc-check
on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::416121583617:role/lovebug-github-actions
          aws-region: ap-northeast-2
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
