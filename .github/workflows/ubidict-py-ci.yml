name: ubidict-py CI

# AI 워커는 ubidicExtractor/ 아래에 test/(R&D 프로토타입)와 ubidict-py/(프로덕션
# FastAPI 서비스)로 나뉘어 있다. test/는 CI 대상이 아니다(사람이 CLI로 직접 채점하는
# R&D 산출물 — ubidicExtractor/ubidict-py/task.md·AGENTS.md 참고). ubidict-py/ 변경에만
# 반응한다.
#
# 경로는 저장소 루트 기준이다. 원래 ubidicExtractor/ 가 독립 저장소여서 ubidict-py/** 로
# 적혀 있었는데, 일반 디렉터리로 편입하면서 GitHub Actions 가 인식하는 루트
# .github/workflows/ 로 옮겼다(하위 경로의 워크플로는 실행되지 않는다).
on:
  push:
    branches: [main, develop]
    paths:
      - "ubidicExtractor/ubidict-py/**"
      - ".github/workflows/ubidict-py-ci.yml"
  pull_request:
    paths:
      - "ubidicExtractor/ubidict-py/**"
      - ".github/workflows/ubidict-py-ci.yml"

defaults:
  run:
    working-directory: ubidicExtractor/ubidict-py

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          # action 입력은 defaults.run.working-directory 를 따르지 않는다 — 루트 기준 경로.
          cache-dependency-path: ubidicExtractor/ubidict-py/pyproject.toml

      - name: Install (with dev extras)
        run: pip install -e ".[dev]"

      # 실제 버그를 잡는 규칙만 본다(E4/E7/E9/F) — pyproject.toml [tool.ruff.lint]
      # 참고. test/에서 그대로 포팅한 코드의 스타일까지 강제로 안 뜯어고친다.
      - name: Lint (ruff)
        run: ruff check .

      # Gemini·SQS·MySQL을 실제로 부르는 테스트는 없다(비용·비결정성 때문에
      # 의도적으로 뺐다 — tests/test_main.py 상단 주석 참고). 그건 사람이
      # 실제 인프라로 수동 검증했다(task.md, 2026-09-13 실제 SQS E2E 기록).
      - name: Test (pytest)
        run: pytest tests/ -v
