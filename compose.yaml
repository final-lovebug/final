#      #
#      # MySQL URL에 파라미터를 붙이지 않는다. Connector/J 기본 sslMode=PREFERRED와
#      # MySQL 8.4의 자동 생성 인증서로 TLS가 협상되어 caching_sha2_password가
#      # 성립한다. sslMode=DISABLED를 넣는 순간 allowPublicKeyRetrieval이 필요해진다.
