# 전체 통합 테스트용 Compose.
#
# 로컬 실행용인 backend/compose.yaml과 역할이 다르다. 이 파일은 backend·frontend 이미지를
# 직접 빌드해 인프라와 함께 띄우고, `docker compose up`으로 직접 기동한다.
#
# ⚠ bootRun·Vite dev 서버와 동시에 띄우지 않는다. backend/compose.yaml도 3000을 퍼블리시하고
#   bootRun은 8080을, `npm run dev`는 5173을 점유한다. Compose 프로젝트는 분리되지만
#   호스트 포트는 공유 자원이라 `port is already allocated`로 죽는다.
#
# ⚠ 첫 실행은 이미지를 하나씩 따로 빌드한다. Grafana LGTM 스택과 Gradle·Vite 빌드가 겹치면
#   Docker Desktop 기본 메모리에서 빌드가 OOM으로 죽는다.
#     docker compose build backend
#     docker compose build frontend
#     docker compose up -d
#
# ⚠ GOOGLE_CLIENT_ID·GOOGLE_CLIENT_SECRET은 기본값이 없는 유일한 시크릿이다. 루트 `.env`
#   (커밋 금지 — .gitignore에 등록돼 있다)나 셸 환경변수로 넘긴다. 값이 없어도 스택은 뜬다 —
#   Google 로그인만 실패하고, local 프로파일의 /api/auth/dev/login으로 토큰을 받을 수 있다.

name: ubidic

services:
  grafana-lgtm:
    image: 'grafana/otel-lgtm:0.32.1'
    ports:
      - '3000:3000'
      # Spring Boot Docker Compose가 OTLP connection detail의 host port를 조회한다.
      - '4317'
      - '4318'
    # 앱은 세 신호를 OTLP로 여기 보낸다(T-INT-23). backend 서비스가 주석 처리돼 있는 동안에는
    # bootRun이 backend/compose.yaml의 LGTM을 따로 띄우므로 이 컨테이너는 Grafana UI(3000)를
    # 열어 두는 역할만 한다 — 두 파일의 구성을 맞춰 두려고 남긴다.
    #
    # backend 서비스를 되살릴 때 OTLP 주소를 환경변수로 넣지 않는다. spring-boot-docker-compose가
    # 이 컨테이너의 host port를 조회해 주입하므로 주소를 적으면 오히려 어긋난다(D-94).
    # Grafana Cloud로 나가는 경로는 prod 프로파일에만 있다.

  # AI 워커 요청 큐(SQS)의 로컬 대체(D-74·D-75).
  #
  # ⚠ **dev 경로는 더 이상 이것을 쓰지 않는다.** 로컬 dev 를 운영과 같은 구성으로 맞추면서
  #   백엔드도 워커도 실제 AWS SQS 에 붙는다(application-dev.yml). 이 서비스는 자격증명 없이
  #   큐 경로만 만져 보고 싶을 때의 대체재로 남겨 둔다 — 쓰려면 백엔드에
  #   SPRING_CLOUD_AWS_ENDPOINT 를, 워커에 SQS_ENDPOINT_URL·SQS_REQUEST_QUEUE_URL 을 덮는다.
  #
  # backend/compose.yaml은 4566을 퍼블리시하지만 여기서는 하지 않는다. 그쪽이 포트를 고정한
  # 이유는 spring-boot-docker-compose가 LocalStack 접속 정보를 자동 주입하지 않아
  # application-dev.yml이 호스트 주소를 직접 가리켜야 해서다. 이 파일에서는 backend 컨테이너가
  # Compose 네트워크로 http://localstack:4566을 부르므로 그 이유가 없고, 큐 확인은
  # `docker compose exec localstack awslocal sqs ...`로 컨테이너 안에서 하면 된다.
  # 루트 CLAUDE.md의 「노출 포트는 앱 포트만」을 그대로 지킨다.
  localstack:
    image: 'localstack/localstack:4'
    environment:
      - 'SERVICES=sqs'
      - 'EAGER_SERVICE_LOADING=1'
      - 'DEBUG=0'
    ports:
      # 호스트 포트를 고정한다. spring-boot-docker-compose 는 LocalStack 커넥션 정보를
      # 자동 주입하지 않아, 호스트에서 백엔드를 띄우면 application-dev.yml 의
      # ${AWS_ENDPOINT:http://localhost:4566} 이 이 주소를 직접 가리킨다 — 동적 포트면
      # 닿지 못해 lovebug-llm-request 발행이 Connection refused 로 실패한다.
      # backend 서비스를 컨테이너로 띄우던 동안에는 내부 네트워크(localstack:4566)를 써서
      # 드러나지 않았던 문제다. backend/compose.yaml 이 같은 이유로 이미 4566 을 고정한다.
      - '4566:4566'
    healthcheck:
      test: 'curl -fsS http://127.0.0.1:4566/_localstack/health'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
      start_interval: 2s
    # 큐를 미리 만들지 않는다(D-78). 초기화 스크립트와 리스너 기동의 순서 경합을 없애려고
    # application-dev.yml이 queue-not-found-strategy를 create로 두어 첫 접근에 만든다.

  mysql:
    image: 'mysql:8.4'
    command:
      - '--character-set-server=utf8mb4'
      - '--collation-server=utf8mb4_0900_ai_ci'
    environment:
      - 'MYSQL_DATABASE=ubidic'
      - 'MYSQL_PASSWORD=ubidic'
      - 'MYSQL_ROOT_PASSWORD=ubidic'
      - 'MYSQL_USER=ubidic'
    ports:
      - '55487:3306'
    healthcheck:
      # -h 127.0.0.1로 TCP를 강제한다. 공식 엔트리포인트의 초기화용 임시 서버는
      # --skip-networking이라 TCP가 열리지 않으므로 초기화 창이 정확히 배제된다.
      # mysqladmin ping은 Access denied에도 exit 0이라 계정 검증이 안 되므로
      # 실제 쿼리를 쓴다.
      test: "mysql -h 127.0.0.1 -uubidic -pubidic -e 'select 1' ubidic"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
      start_interval: 2s
    volumes:
      - 'mysql-data:/var/lib/mysql'

  redis:
    image: 'redis:8.2-alpine'
    ports:
      - '65423:6379'
    healthcheck:
      # 로딩 중 에러 응답도 exit 0이므로 PONG을 직접 확인한다.
      test: 'redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
      start_interval: 2s
    volumes:
      - 'redis-data:/data'

  # FastAPI 워커는 별도 ubidicExtractor 저장소의 Dockerfile로 빌드한다.
  # 이 Compose를 쓰려면 같은 루트에 `ubidicExtractor/ubidict-py`를 checkout해야 한다.
  #
  # **기본은 mode=MOCK**이다(백엔드 dev 프로파일의 app.ai.mode 기본값). 모델 키 없이 SQS 요청을
  # Spring 콜백으로 돌린다. 다만 대조 MOCK 만은 백엔드 DB를 읽는다(읽기 전용) — 제안어가 쓸모
  # 있으려면 앵커가 본문의 실제 구간이어야 하고 대체 용어가 활성 사전집의 표준어여야 하는데,
  # 둘 다 DB를 봐야 알 수 있다(docs/AI_CONTRACT.md 5-2).
  #
  # ── dev 는 실제 AWS SQS · 실제 Gemini 를 쓴다 ─────────────────────────────
  # 로컬 dev 를 운영과 같은 구성으로 맞춘 결과다 — LocalStack 을 타지 않는다.
  # 준비물 셋:
  #   1) AWS 자격증명 — 아래에서 호스트의 ~/.aws 를 읽기 전용으로 마운트한다. 키를 .env 로
  #      복사하지 않는다. sqs:ReceiveMessage·DeleteMessage·GetQueueUrl·GetQueueAttributes 가 필요하다.
  #   2) Gemini 키 — 루트 `.env`의 GEMINI_API_KEY(.env.example 참고). Compose 가 자동으로 읽는다.
  #   3) 백엔드 — application-dev.yml 의 app.ai.mode 가 real 이라 요청 메시지가 REAL 로 나간다(D-71).
  #        ./gradlew bootRun --args='--spring.profiles.active=local,dev'
  #
  # ⚠ **운영과 같은 큐다.** 운영 EC2 워커가 lovebug-llm-request 를 폴링 중이면 메시지가 두
  #   워커에 무작위로 갈려 양쪽 다 조용히 실패한다 — 로컬 테스트 동안에는 운영 워커를 내려 둔다.
  # ⚠ REAL 은 실제로 과금된다. **중복 방지가 없으므로**(R-35) 재배달되면 모델도 다시 불린다.
  llm-worker:
    build:
      context: './ubidicExtractor/ubidict-py'
    environment:
      - 'AWS_REGION=ap-northeast-2'
      # 비워 두면 실제 AWS SQS 다(app/queue_consumer.build_sqs_client). LocalStack 으로 되돌리려면
      # 셸이나 루트 .env 에서 SQS_ENDPOINT_URL·SQS_REQUEST_QUEUE_URL 을 함께 덮는다.
      - 'SQS_ENDPOINT_URL=${SQS_ENDPOINT_URL:-}'
      - 'SQS_REQUEST_QUEUE_URL=${SQS_REQUEST_QUEUE_URL:-https://sqs.ap-northeast-2.amazonaws.com/416121583617/lovebug-llm-request}'
      # 워커는 완료를 동기 HTTP 콜백으로 알린다(D-68). 기본값이 host.docker.internal 인 이유는
      # backend 서비스를 주석으로 내려 백엔드가 호스트에서 돌기 때문이다 — 컨테이너 안에서
      # 'backend' 는 DNS 로 풀리지 않아 콜백이 Name or service not known 으로 실패한다.
      # backend 서비스를 되살려 컨테이너로 띄울 때는 http://backend:8080 으로 덮어쓴다.
      - 'BACKEND_CALLBACK_BASE_URL=${BACKEND_CALLBACK_BASE_URL:-http://host.docker.internal:8080}'
      # 대조 MOCK 이 document_version.body 와 활성 사전집의 term 을 읽는 데 쓴다. mysql 서비스와 같은 값이다.
      - 'MYSQL_HOST=mysql'
      - 'MYSQL_PORT=3306'
      - 'MYSQL_USER=ubidic'
      - 'MYSQL_PASSWORD=ubidic'
      - 'MYSQL_DATABASE=ubidic'
      # mode=REAL 전용. 값 없는 바 형식이라 루트 `.env`나 셸에 없으면 컨테이너에 아예 들어가지
      # 않는다 — MOCK 만 쓸 때 빈 문자열이 들어가 키가 있는 것처럼 보이는 일을 막는다.
      # 키를 여러 개 돌려 쓰려면 GEMINI_API_KEY_1/_2… 를 쓴다(app/pipeline/api_keys.py).
      - GEMINI_API_KEY
      - GEMINI_API_KEY_1
      - GEMINI_API_KEY_2
      - 'GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}'
    healthcheck:
      # python:3.11-slim에는 curl이 없으므로 표준 라이브러리로 health endpoint를 확인한다.
      test: >-
        python -c "from urllib.request import urlopen;
        urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    # 실제 AWS SQS 를 쓰므로 localstack 을 기다리지 않는다. MySQL 은 REAL 이 문서 본문·
    # 사전집 용어를 읽어야 해서 여전히 필요하다.
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # 호스트의 AWS 자격증명을 읽기 전용으로 빌려 쓴다. 키를 .env 나 이미지에 복사하지 않기
      # 위해서다 — 컨테이너는 root 로 돌므로 /root/.aws 가 기본 조회 경로다.
      - '${HOME}/.aws:/root/.aws:ro'

#  backend:
#    build:
#      context: './backend'
#    ports:
#      - '8080:8080'
#    environment:
#      # 프로파일 순서가 의미를 갖는다(D-46).
#      # - local: DevAuthController·DevLoginService가 @Profile("local")이라 이것이 있어야
#      #          등록된다. Google 왕복 없이 토큰을 받을 수 있고 app.auth.cookie.secure도
#      #          false로 덮인다. dev 단독으로 띄우면 두 빈이 없어, Google 로그인을 실제로
#      #          성공시키기 전까지 모든 도메인 API가 401이다.
#      # - dev  : 뒤에 와서 충돌 키를 이긴다 — app.ai.dispatch.mode가 sqs로 남아 LocalStack
#      #          경로를 타고, 시크릿을 Parameter Store가 아니라 환경변수로 받는다.
#      - 'SPRING_PROFILES_ACTIVE=local,dev'
