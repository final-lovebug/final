  # Vite 빌드 산출물을 nginx로 정적 서빙한다. 운영이 S3 + CloudFront 정적 호스팅이므로
  # (.github/workflows/front-cd.yml) 리버스 프록시를 두지 않고 CORS 구성을 그대로 검증한다.
  #
  # 5173을 쓰는 이유는 app.cors.allowed-origins·app.oauth.frontend-redirect-uri의 기본값이
  # http://localhost:5173이라, compose로 띄우든 `npm run dev`로 띄우든 origin이 같아지기
  # 때문이다. 둘을 동시에 띄우면 포트가 겹쳐 죽지만 애초에 택일 관계다.
  frontend:
    build:
      context: './frontend'
    ports:
      - '5173:80'
    healthcheck:
      # nginx:alpine에는 curl이 없다. busybox wget을 쓴다.
      test: 'wget -q --spider http://127.0.0.1/ || exit 1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
      start_interval: 2s

volumes:
  mysql-data:
  redis-data:
