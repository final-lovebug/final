#      # 값 없는 바 형식을 쓴다. KEY=${KEY} 로 적으면 미설정 시 빈 문자열이 들어가고,
#      # OAuth2ClientProperties.validate()가 빈 client-id를 거부해 컨텍스트가 죽는다.
