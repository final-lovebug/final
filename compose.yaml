#      - 'REDIS_HOST=redis'
#      - 'REDIS_PORT=6379'
#      #
#      # 실제 AWS SQS 에 붙는다 — application-dev.yml 이 엔드포인트도 자격증명도 적지 않으므로
#      # SDK 기본 체인이 쓰인다. 컨테이너로 띄운다면 호스트의 ~/.aws 를 llm-worker 처럼
#      # 마운트하거나 AWS_ACCESS_KEY_ID/SECRET 을 주입해야 한다.
#      # LocalStack 으로 되돌리려면:
#      #   - 'SPRING_CLOUD_AWS_ENDPOINT=http://localstack:4566'
