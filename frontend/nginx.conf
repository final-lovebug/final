# 전체 통합 테스트용 정적 서빙 설정. 루트 compose.yaml 의 frontend 서비스가 쓴다.
#
# 운영은 S3 + CloudFront 정적 호스팅이므로(.github/workflows/front-cd.yml) 여기서도
# 리버스 프록시를 두지 않는다. 브라우저는 http://localhost:8080 으로 백엔드를 직접 부르고
# CORS 로 허용된다(app.cors.allowed-origins). 프록시를 끼우면 same-origin 이 되어
# 정작 운영에서 문제가 되는 CORS·쿠키 동작을 통합 테스트가 덮어 버린다.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # createBrowserRouter(src/app/router.tsx)를 쓰므로 딥링크가 404 가 되지 않게
    # 없는 경로는 index.html 로 넘긴다. 이게 없으면 /workspaces 를 새로고침할 때 깨진다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 캐시 정책은 front-cd.yml 의 S3 동기화 규칙과 같은 기준으로 맞춘다.
    # 파일명에 해시가 붙는 산출물만 장기 캐시한다.
    location /assets/ {
        add_header Cache-Control "public,max-age=31536000,immutable";
    }

    # index.html 은 새 배포를 즉시 받아야 하므로 캐시하지 않는다.
    location = /index.html {
        add_header Cache-Control "no-cache,no-store,must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
