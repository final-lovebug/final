spring:
  application:
    name: backend
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"

# 아래는 src/main/resources/application.yml과 동일하게 맞춘 값이다 — 테스트 클래스패스에서
# 이 파일이 main의 application.yml을 완전히 가려버려서(병합이 아니라 대체), 여기 없으면
# @SpringBootTest 전체 컨텍스트를 띄우는 테스트에서 JwtProvider 등의 빈 생성이 실패한다.
# main 파일이 바뀌면 이 파일도 함께 갱신해야 한다.
app:
  messaging:
    mode: ${MESSAGING_MODE:in-memory}
    sqs:
      queue: ${MESSAGING_SQS_QUEUE:lovebug-domain-event}
      # 추출·대조 워커용 큐. AWS에는 이미 만들어져 있지만 읽는 코드가 아직 없다.
      # 지금 살려 두면 「이 키를 읽는 코드가 0줄」인 죽은 프로퍼티가 된다(Y-28이 지적한 결함).
      # DD-5(문서 대조)·DI-5(용어 추출) 워커가 들어올 때 주석을 푼다.
      # llm-request-queue: ${MESSAGING_SQS_LLM_REQUEST_QUEUE:lovebug-llm-request}
      # llm-reply-queue: ${MESSAGING_SQS_LLM_REPLY_QUEUE:lovebug-llm-reply}
  crossdomain:
    dictionary:
      mode: ${DICTIONARY_CROSSDOMAIN_MODE:real}
    document:
      mode: ${DOCUMENT_CROSSDOMAIN_MODE:real}
    draft-document:
      mode: ${DRAFT_DOCUMENT_CROSSDOMAIN_MODE:real}
    draft-dictionary:
      mode: ${DRAFT_DICTIONARY_CROSSDOMAIN_MODE:real}
    workspace:
      mode: ${WORKSPACE_CROSSDOMAIN_MODE:real}
    review-request:
      mode: ${REVIEW_REQUEST_CROSSDOMAIN_MODE:real}
    document-publish:
      mode: ${DOCUMENT_PUBLISH_CROSSDOMAIN_MODE:real}
    dictionary-publish:
      mode: ${DICTIONARY_PUBLISH_CROSSDOMAIN_MODE:real}
  ai:
    extractor:
      mode: ${AI_EXTRACTOR_MODE:stub}
    checker:
      mode: ${AI_CHECKER_MODE:stub}
  jwt:
    secret: "${JWT_SECRET:local-dev-only-jwt-secret-do-not-use-in-production-0123456789}"
    access-token-validity: 30m
    refresh-token-validity: 7d
  oauth:
    frontend-redirect-uri: "${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth/callback}"
  auth:
    cookie:
      secure: true
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
