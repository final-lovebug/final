spring.application.name=backend
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# 아래는 src/main/resources/application.properties와 동일하게 맞춘 값이다 — 테스트 클래스패스에서
# 이 파일이 main의 application.properties를 완전히 가려버려서(병합이 아니라 대체), 여기 없으면
# @SpringBootTest 전체 컨텍스트를 띄우는 테스트에서 JwtProvider 등의 빈 생성이 실패한다.
# main 파일이 바뀌면 이 파일도 함께 갱신해야 한다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-do-not-use-in-production-0123456789}
app.jwt.access-token-validity=30m
app.jwt.refresh-token-validity=7d
app.oauth.frontend-redirect-uri=${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/callback}
app.auth.cookie.secure=true
