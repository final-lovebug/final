# 개발 서버 프로파일(NFR-INF-002·D-46).
#
# prod와 갈리는 지점은 하나다 — 시크릿을 AWS Parameter Store가 아니라 환경변수로 받는다.
# 그래서 spring.config.import 가 없고 spring.cloud.aws.parameterstore.enabled 도 기본값(false)을 그대로 쓴다.
# 값은 저장소에 두지 않고 ${VAR} 참조만 남긴다(루트 CLAUDE.md 「시크릿은 환경변수 또는 AWS 파라미터 스토어로 주입한다」).
spring:
  # **실제 AWS SQS 에 붙는다.** 엔드포인트도 자격증명도 여기 적지 않는다 — 적지 않아야
  # SDK 의 기본 체인(~/.aws/credentials · 환경변수 · 인스턴스 역할)이 그대로 동작하고,
  # 로컬에서 띄운 dev 가 운영과 같은 경로를 탄다(NFR-INF-005).
  #
  # ⚠ 운영과 **같은 큐**(lovebug-llm-request)를 쓴다. 운영 EC2 워커가 그 큐를 폴링하고
  #   있으면 메시지가 두 워커에 갈려 양쪽 다 조용히 실패한다 — 로컬에서 dev 를 띄우는
  #   동안에는 운영 워커 컨테이너를 내려 둔다.
  #
  # LocalStack 으로 되돌리려면 yml 을 고치지 말고 환경변수로 덮는다:
  #   SPRING_CLOUD_AWS_ENDPOINT=http://localhost:4566 \
  #   AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test \
  #   SPRING_CLOUD_AWS_SQS_QUEUE_NOT_FOUND_STRATEGY=create ./gradlew bootRun ...
  cloud:
    aws:
      sqs:
        # 큐가 없으면 기동을 멈춘다. 실제 계정에 붙으므로, 이름을 틀렸을 때 조용히 새 큐가
        # 생기는 쪽이 훨씬 위험하다(D-78). prod 와 같은 값이다.
        queue-not-found-strategy: fail
  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  opentelemetry:
    resource-attributes:
      deployment.environment.name: dev

app:
  ai:
    dispatch:
      # 추출·대조 요청을 인프로세스 대역이 아니라 LocalStack SQS 큐로 보낸다.
      mode: sqs
    # 워커가 실제 모델을 부를지 정하는 축이다(D-71). 위의 dispatch.mode 와 이름이 같지만
    # 다른 축이다 — dispatch 는 「어떻게 보낼지」, 이것은 「워커가 무엇을 할지」다.
    # 요청 메시지에 실려 나가고 백엔드는 이 값으로 분기하지 않는다.
    #
    # dev 는 mock 이 기본이다(D-86) — Spring → LocalStack → FastAPI → Spring 왕복을
    # 비용 없이 확인하려면 결과에 데이터가 있어야 한다. stub 은 빈 결과라 「성공했지만
    # 후보어 0건」과 실패를 구분할 수 없어 화면까지 흐르는지 볼 수 없다.
    #
    # **실제 모델로 확인하려면 AI_MODE=real 로 띄운다.**
    #   AI_MODE=real ./gradlew bootRun --args='--spring.profiles.active=local,dev'
    # 워커 쪽에도 Gemini 키가 있어야 한다(루트 .env 의 GEMINI_API_KEY → compose 가 주입).
    # 둘 중 하나만 하면 조용히 mock 으로 돌거나 실패 콜백만 본다. 실제 과금되는 경로이고
    # 중복 방지가 없으므로(R-35) 재배달 시 모델이 두 번 불릴 수 있다 — 확인 후 되돌린다.
    mode: ${AI_MODE:real}

  security:
    actuator:
      # 개발 서버도 /actuator/prometheus 를 연다(D-97). prod 는 기본값(false)으로 닫힌다.
      permit-all: true
