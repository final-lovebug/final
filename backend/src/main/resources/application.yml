spring:
  application:
    name: backend
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID}"
            client-secret: "${GOOGLE_CLIENT_SECRET}"

app:
  crossdomain:
    dictionary:
      mode: ${DICTIONARY_CROSSDOMAIN_MODE:stub}
  jwt:
    secret: "${JWT_SECRET:local-dev-only-jwt-secret-do-not-use-in-production-0123456789}"
    access-token-validity: 30m
    refresh-token-validity: 7d
  oauth:
    # 프론트엔드가 아직 정해지지 않아 임시값이다 - 프론트 개발 시작 시 실제 값으로 교체한다.
    frontend-redirect-uri: "${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/callback}"
  auth:
    cookie:
      # refresh token 쿠키의 Secure 플래그. 로컬(http)에서는 application-local.yml이 false로 덮어쓴다.
      secure: true
