spring:
  flyway:
    enabled: false

app:
  # http://localhost로 로컬 실행할 때 Secure 쿠키는 브라우저가 돌려보내지 않으므로 끈다.
  auth:
    cookie:
      secure: false
  ai:
    dispatch:
      # AI 워커는 로컬에 없다. 큐 대신 인프로세스 대역이 빈 결과를 돌려준다(D-74).
      # 실제 워커를 붙여 보려면 dev 프로파일(LocalStack)로 띄운다.
      mode: in-process
  security:
    actuator:
      # /actuator/prometheus 를 토큰 없이 연다. 노출(exposure.include)만으로는 401 이라
      # 「눈으로 확인하는 수단」이 실제로는 동작하지 않는다(D-97).
      permit-all: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
