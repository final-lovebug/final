# 운영 설정. 시크릿은 저장소에 두지 않고 AWS Parameter Store(/lovebug/ 이하)에서 주입한다.
# 파라미터 이름은 접두어 /lovebug/ 를 뗀 뒤 '/'를 '.'으로 바꾼 프로퍼티로 노출된다.
#   예) /lovebug/rds/password -> rds.password
# 리전은 컨테이너에 주입된 AWS_REGION(또는 EC2 인스턴스 메타데이터)에서 결정된다.
spring:
  # application.yml 이 기본 off 로 두므로 여기서 명시적으로 켠다 — 이 프로파일만 Parameter Store 를 읽는다.
  cloud:
    aws:
      parameterstore:
        enabled: true

  config:
    import: aws-parameterstore:/lovebug/

  datasource:
    url: ${rds.url}
    username: ${rds.username}
    password: ${rds.password}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${oauth.google.client-id}
            client-secret: ${oauth.google.client-secret}
            scope:
              - openid
              - email
  # 지금 상태로는 두 클라이언트가 localhost 기본값을 쓰므로 운영에서 반드시 채워야 한다.
  data:
     redis:
       host: ${redis.host}
       port: ${redis.port}
       ssl:
         enabled: true
app:
  messaging:
    mode: sqs
    sqs:
      queue: lovebug-domain-event
      # AI 워커 전용 큐(D-67). DLQ 와 redrive policy 는 인프라에서 건다(NFR-MSG-004).
      llm-request-queue: lovebug-llm-request
  ai:
    dispatch:
      mode: sqs
    # 운영에서는 워커가 실제 모델을 호출한다.
    mode: real
  jwt:
    secret: ${jwt.secret}
  oauth:
    # 프론트엔드 주소가 미확정이라 파라미터로 빼둔다 - 값이 정해지면 파라미터만 교체한다.
    # 지금 프론트는 https://ubidic.site 이므로 /lovebug/oauth/frontend-redirect-uri 에는
    # https://ubidic.site/oauth/callback 이 들어가야 한다(라우트는 frontend/src/app/router.tsx).
    frontend-redirect-uri: ${oauth.frontend-redirect-uri}
  cors:
    # 운영 프론트 도메인. refresh token 이 쿠키 기반이라 "*" 를 쓸 수 없고 origin 을 명시한다.
    # origin 은 스킴+호스트까지만이며 경로·후행 슬래시를 붙이면 매칭되지 않는다.
    allowed-origins: "${CORS_ALLOWED_ORIGINS:https://ubidic.site,https://www.ubidic.site}"

# 관측(T-INT-23). 이 프로파일에서만 Grafana Cloud 로 내보낸다(D-94) — 다른 프로파일에는
# 엔드포인트도 자격증명도 없어 로컬 LGTM 으로만 나간다.
#
# otel.endpoint / otel.auth 는 위 spring.config.import 가 /lovebug/otel/ 에서 끌어온 값이다.
# otel.auth 는 instanceID:token 원문이라 그대로 쓸 수 없고, OtlpAuthHeaderEnvironmentPostProcessor
# 가 base64 로 인코딩해 otel.auth-header 를 만들어 둔다.
management:
  endpoint:
    health:
      # 무인증으로 열려 있는 경로라 컴포넌트별 상세를 아무에게나 보여주지 않는다(D-97).
      show-details: when-authorized
      probes:
        enabled: true
  tracing:
    # /lovebug/otel/enabled 가 킬 스위치다. 파라미터가 없으면 켠 것으로 본다 — 셋이 한 값을 보므로
    # 세 신호가 함께 꺼진다. 꺼도 스팬 생성과 MDC 의 traceId 는 살아 있다.
    export:
      otlp:
        enabled: ${otel.enabled:true}
    sampling:
      # 전량 수집하면 무료 한도를 빨리 태운다. 한도가 빠듯해지면 이 값을 먼저 내린다.
      probability: ${OTEL_SAMPLE_RATIO:0.1}
  logging:
    export:
      otlp:
        enabled: ${otel.enabled:true}
  opentelemetry:
    resource-attributes:
      deployment.environment.name: prod
      # 이미지 태그(커밋 SHA). start_container.sh 가 넣는다 — 어느 리비전이 낸 텔레메트리인지
      # 알 수 없으면 배포와 장애를 연결할 수 없다.
      service.version: ${OTEL_SERVICE_VERSION:unknown}
    tracing:
      export:
        otlp:
          endpoint: ${otel.endpoint}/v1/traces
          transport: http
          compression: gzip
          headers:
            # 빈 기본값을 두는 이유 — 자격증명이 없을 때 플레이스홀더 해석 실패로 기동이 깨지면
            # 관측 때문에 서비스가 죽는다. 관측은 있으면 좋은 것이지 기동 조건이 아니다(D-98).
            Authorization: ${otel.auth:}
    logging:
      export:
        otlp:
          endpoint: ${otel.endpoint}/v1/logs
          transport: http
          compression: gzip
          headers:
            Authorization: ${otel.auth:}
  otlp:
    # 메트릭만 네임스페이스가 다르다(Micrometer 레지스트리 계보). 엔드포인트가 없어도 익스포터가
    # 만들어져 localhost:4318 로 붙으려 하므로 enabled 가 유일한 차단 수단이다.
    metrics:
      export:
        enabled: ${otel.enabled:true}
        url: ${otel.endpoint}/v1/metrics
        aggregation-temporality: cumulative
        step: 60s
        headers:
          Authorization: ${otel.auth:}

server:
  forward-headers-strategy: framework
