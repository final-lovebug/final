# 운영 설정. 시크릿은 저장소에 두지 않고 AWS Parameter Store(/lovebug/ 이하)에서 주입한다.
# 파라미터 이름은 접두어 /lovebug/ 를 뗀 뒤 '/'를 '.'으로 바꾼 프로퍼티로 노출된다.
#   예) /lovebug/rds/password -> rds.password
# 리전은 컨테이너에 주입된 AWS_REGION(또는 EC2 인스턴스 메타데이터)에서 결정된다.
spring:
  config:
    import: aws-parameterstore:/lovebug/

  datasource:
    url: ${rds.url}
    username: ${rds.username}
    password: ${rds.password}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${oauth.google.client-id}
            client-secret: ${oauth.google.client-secret}

  # 지금 상태로는 두 클라이언트가 localhost 기본값을 쓰므로 운영에서 반드시 채워야 한다.
  data:
     redis:
       host: ${redis.host}
       port: ${redis.port}
       ssl:
         enabled: true
app:
  jwt:
    secret: ${jwt.secret}
  oauth:
    # 프론트엔드 주소가 미확정이라 파라미터로 빼둔다 - 값이 정해지면 파라미터만 교체한다.
    frontend-redirect-uri: ${oauth.frontend-redirect-uri}

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
