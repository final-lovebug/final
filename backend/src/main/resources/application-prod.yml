# 운영 설정. 시크릿은 저장소에 두지 않고 AWS Parameter Store(/lovebug/ 이하)에서 주입한다.
# 파라미터 이름은 접두어 /lovebug/ 를 뗀 뒤 '/'를 '.'으로 바꾼 프로퍼티로 노출된다.
#   예) /lovebug/rds/password -> rds.password
# 리전은 컨테이너에 주입된 AWS_REGION(또는 EC2 인스턴스 메타데이터)에서 결정된다.
spring:
  # application.yml 이 기본 off 로 두므로 여기서 명시적으로 켠다 — 이 프로파일만 Parameter Store 를 읽는다.
  cloud:
    aws:
      parameterstore:
        enabled: true

  config:
    import: aws-parameterstore:/lovebug/

  datasource:
    url: ${rds.url}
    username: ${rds.username}
    password: ${rds.password}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${oauth.google.client-id}
            client-secret: ${oauth.google.client-secret}

  # 지금 상태로는 두 클라이언트가 localhost 기본값을 쓰므로 운영에서 반드시 채워야 한다.
  data:
     redis:
       host: ${redis.host}
       port: ${redis.port}
       ssl:
         enabled: true
app:
  messaging:
    mode: sqs
    sqs:
      queue: lovebug-domain-event
      # AI 워커 전용 큐(D-67). DLQ 와 redrive policy 는 인프라에서 건다(NFR-MSG-004).
      llm-request-queue: lovebug-llm-request
  ai:
    dispatch:
      mode: sqs
    # 운영에서는 워커가 실제 모델을 호출한다.
    mode: real
  jwt:
    secret: ${jwt.secret}
  oauth:
    # 프론트엔드 주소가 미확정이라 파라미터로 빼둔다 - 값이 정해지면 파라미터만 교체한다.
    # 지금 프론트는 https://ubidic.site 이므로 /lovebug/oauth/frontend-redirect-uri 에는
    # https://ubidic.site/oauth/callback 이 들어가야 한다(라우트는 frontend/src/app/router.tsx).
    frontend-redirect-uri: ${oauth.frontend-redirect-uri}
  cors:
    # 운영 프론트 도메인. refresh token 이 쿠키 기반이라 "*" 를 쓸 수 없고 origin 을 명시한다.
    # origin 은 스킴+호스트까지만이며 경로·후행 슬래시를 붙이면 매칭되지 않는다.
    allowed-origins: "${CORS_ALLOWED_ORIGINS:https://ubidic.site,https://www.ubidic.site}"

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
