spring.application.name=backend
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.jwt.secret=${JWT_SECRET:local-dev-only-jwt-secret-do-not-use-in-production-0123456789}
app.jwt.access-token-validity=30m
app.jwt.refresh-token-validity=7d
# 프론트엔드가 아직 정해지지 않아 임시값이다 - 프론트 개발 시작 시 실제 값으로 교체한다.
app.oauth.frontend-redirect-uri=${OAUTH_FRONTEND_REDIRECT_URI:http://localhost:3000/oauth/callback}
# refresh token 쿠키의 Secure 플래그. 로컬(http)에서는 application-local.properties가 false로 덮어쓴다.
app.auth.cookie.secure=true
